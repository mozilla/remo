db:
  image: mysql:5.5
  environment:
    - MYSQL_DATABASE=remo
    - MYSQL_USER=remo
    - MYSQL_PASSWORD=remo
    - MYSQL_ROOT_PASSWORD=root
memcached:
  image: memcached
broker:
  image: rabbitmq
web:
  build: .
  ports:
    - "8000:8000"
  volumes:
    - .:/code
  links:
    - db
    - broker
    - memcached
  command: bash -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
celery:
  build: .
  volumes:
    - .:/code
  links:
    - db
    - broker
    - memcached
  command: celery -A remo worker -B -l INFO
  environment:
    - C_FORCE_ROOT=true
